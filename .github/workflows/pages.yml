# Publishes the web version (the "Open in your browser" button) on GitHub Pages at each push on main.
name: Web version

on:
  workflow_dispatch:
  push:
    branches: [main]

# Read-only by default: only the deploy job may publish the site.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      # Exactly the versions of the lockfile.
      - name: Dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1' # the web version does not need Electron
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm exec vite build
      # Pages must be on, with Settings > Pages > Source set to "GitHub Actions".
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
