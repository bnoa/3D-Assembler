# Publishes the web version (the "Open in your browser" button) on GitHub Pages at each push on main.
name: Web version

on:
  workflow_dispatch:
  push:
    branches: [main]

# Read-only by default: only the deploy job may publish the site.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      # Exactly the versions of the lockfile.
      - name: Dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1' # the web version does not need Electron
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm exec vite build
      # Pages must be on, with Settings > Pages > Source set to "GitHub Actions".
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
