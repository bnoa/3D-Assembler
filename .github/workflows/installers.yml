# Builds the installers of the desktop app on each system (macOS and Linux installers can only be
# made on their own system). Run it from the Actions tab, or by pushing a tag such as v0.1.0; the
# installers are attached to the run (and to the release for a tag).
name: Installers

on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: [main]

# Read-only by default: only the release job can write, and it runs no package code.
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      # Exactly the versions of the lockfile.
      - name: Packages
        run: pnpm install --frozen-lockfile
      - name: Tests
        run: pnpm test
      - name: Installer
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false' # no signing certificate (installers are unsigned)
        # On failure, the last lines of the log become public annotations (logs need a sign-in).
        run: |
          set -o pipefail
          pnpm exec vite build
          if ! pnpm exec electron-builder ${{ matrix.target }} --publish never 2>&1 | tee build.log; then
            # One annotation (a step shows at most ten): the error lines, then the end of the log.
            { grep -E '⨯|Error|error:' build.log | head -n 20; echo '-----'; tail -n 40 build.log; } > tail.log
            echo "::error title=electron-builder::$(sed -e 's/%/%25/g' tail.log | awk '{printf "%s%%0A", $0}')"
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
          if-no-files-found: error

  # Publishes the installers built above (tags only), with no checkout and no package code.
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
          fail_on_unmatched_files: true
