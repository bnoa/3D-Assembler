# Builds the installers of the desktop app on each system (macOS and Linux installers can only be
# made on their own system). Run it from the Actions tab, or by pushing a tag such as v0.1.0; the
# installers are attached to the run (and to the release for a tag).
name: Installers

on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: [main]

# Read-only by default: only the release job can write, and it runs no package code.
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      # Exactly the versions of the lockfile.
      - name: Packages
        run: pnpm install --frozen-lockfile
      - name: Tests
        run: pnpm test
      - name: Installer
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false' # no signing certificate (installers are unsigned)
        # On failure, the last lines of the log become public annotations (logs need a sign-in).
        run: |
          set -o pipefail
          pnpm exec vite build
          if ! pnpm exec electron-builder ${{ matrix.target }} --publish never 2>&1 | tee build.log; then
            # One annotation (a step shows at most ten): the error lines, then the end of the log.
            { grep -E '⨯|Error|error:' build.log | head -n 20; echo '-----'; tail -n 40 build.log; } > tail.log
            echo "::error title=electron-builder::$(sed -e 's/%/%25/g' tail.log | awk '{printf "%s%%0A", $0}')"
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installer-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
          if-no-files-found: error

  # Publishes the installers built above (tags only), with no checkout and no package code.
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
          fail_on_unmatched_files: true
