# Builds the installers of the desktop app on each system (macOS and Linux installers can only be
# made on their own system). Run it from the Actions tab, or by pushing a tag such as v0.1.0; the
# installers are attached to the run (and to the release for a tag).
name: Installers

on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # The local store paths of pnpm-workspace.yaml only exist on the author's machine.
      - name: Packages
        shell: bash
        run: |
          printf 'onlyBuiltDependencies:\n  - electron\n' > pnpm-workspace.yaml
          pnpm install --frozen-lockfile=false
      - name: Tests
        run: pnpm test
      - name: Installer
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false' # no signing certificate (installers are unsigned)
        # On failure, the last lines of the log become public annotations (logs need a sign-in).
        run: |
          set -o pipefail
          pnpm exec vite build
          if ! pnpm exec electron-builder ${{ matrix.target }} --publish never 2>&1 | tee build.log; then
            tail -n 25 build.log | sed -e 's/%/%25/g' | while IFS= read -r line; do echo "::error title=electron-builder::$line"; done
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
