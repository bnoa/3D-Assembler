# Security and version updates for the dependencies and the GitHub Actions used by the workflows.
# Grouped and monthly, to keep the number of pull requests low.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      runtime:
        dependency-type: production
      tooling:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
